<!DOCTYPE html>
<html>
<head>
  <title>Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>User Profile</h2>

  <div class="card">

  <h3>My Account</h3>

  <div id="profile">Loading...</div>

  <br>
<input type="file" id="photo">
<button onclick="reuploadPhoto()">Re-Upload Photo</button>

  <button onclick="logout()">Logout</button>

</div>
<script src="auth.js"></script>
  <script>
    const BASE_URL = "https://aamatrimony.onrender.com";
   if (!localStorage.getItem("token")) {
  window.location.href = "login.html";
} 
    async function loadProfile() {
      const token = localStorage.getItem("token");
      console.log("TOKEN FROM STORAGE:", token);
     const res = await fetch(`${BASE_URL}/profile`, {
        method: "GET",
        headers: {
          "Authorization": token
        }
      });

      const data = await res.json();
  

      console.log(data);

     document.getElementById("profile").innerHTML = `
<div class="profile-card">

    <img
      src="${data.photo || 'https://via.placeholder.com/200'}"
      width="200"
    />

    <h2>${data.fullname || ""}</h2>

    <p><b>Email:</b> ${data.email || ""}</p>

    <p><b>Age:</b> ${data.age || ""}</p>

    <p><b>Gender:</b> ${data.gender || ""}</p>

    <p><b>Religion:</b> ${data.religion || ""}</p>

    <p><b>City:</b> ${data.city || ""}</p>

   <p><b>Education:</b> ${data.education || ""}</p>
    
    <p><b>Occupation:</b> ${data.occupation || ""}</p>

    <p><b>Bio:</b> ${data.bio || ""}</p>

</div>
`;
    }

    loadProfile();
    function logout() {

  localStorage.removeItem("token");

  alert("Logged Out");

  window.location.href = "login.html";

}
async function reuploadPhoto() {

    const file = document.getElementById("photo").files[0];
    const token = localStorage.getItem("token");

    if (!file) {
        alert("Select a photo");
        return;
    }

    const formData = new FormData();
    formData.append("photo", file);

    // STEP 1: upload to backend
    const uploadRes = await fetch("https://aamatrimony.onrender.com/upload-photo", {
        method: "POST",
        headers: {
            "Authorization": token
        },
        body: formData
    });

    const uploadData = await uploadRes.json();

    // STEP 2: save to DB
    const saveRes = await fetch("https://aamatrimony.onrender.com/profile/photo", {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": token
        },
        body: JSON.stringify({
            photo: uploadData.file
        })
    });

    const saveData = await saveRes.json();

    alert(saveData.message);
    location.reload();
}

  </script>



</body>
</html>
